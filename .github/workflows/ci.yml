name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact release commit to verify
        type: string
        required: false
        default: ''
      release-tag:
        description: Release tag that must match the package version
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false
      - name: Require a Conventional Commit PR title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.match(process.env.PR_TITLE, /^(feat|fix|perf|docs|refactor|test|build|ci|chore|style|revert)(\([^()\r\n]+\))?!?: \S[^\r\n]*$/, 'Use a Conventional Commit title, e.g. feat: add model support');
          NODE

  sdk-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26'
          check-latest: true
          package-manager-cache: false
      - name: Require latest stable OMP SDK pins
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const name of ['@oh-my-pi/pi-ai', '@oh-my-pi/pi-coding-agent']) {
            let latest;
            try {
              const response = await fetch(`https://registry.npmjs.org/${name.replace('/', '%2F')}/latest`, { signal: AbortSignal.timeout(10000) });
              assert.ok(response.ok);
              const metadata = await response.json();
              assert.equal(typeof metadata.version, 'string');
              assert.match(metadata.version, /^\d+\.\d+\.\d+$/);
              latest = metadata.version;
            } catch {
              throw new Error(`Cannot verify latest OMP SDK: ${name}`);
            }
            for (const actual of [manifest.devDependencies?.[name], lock.packages?.['']?.devDependencies?.[name], lock.packages?.[`node_modules/${name}`]?.version]) {
              assert.equal(actual, latest, `Stale OMP SDK: ${name}: expected ${latest}, found ${actual}`);
            }
            console.log(`${name}: ${latest}`);
          }
          NODE

  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }}, sdk:${{ matrix.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '26'
            sdk: locked
            shell: bash
            npm: npm
            canonical: true
          - os: windows-latest
            node: '26'
            shell: pwsh
            sdk: locked
            npm: npm.cmd
            canonical: false
          - os: ubuntu-latest
            node: '24'
            sdk: locked
            shell: bash
            npm: npm
            canonical: false
          - os: ubuntu-latest
            node: '26'
            sdk: latest
            shell: bash
            npm: npm
            canonical: false
          - os: windows-latest
            node: '26'
            sdk: latest
            shell: pwsh
            npm: npm.cmd
            canonical: false
    defaults:
      run:
        shell: ${{ matrix.shell }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: npm
      - name: Install pinned package manager
        run: ${{ matrix.npm }} install --global npm@12.2.2
      - name: Install dependencies
        run: ${{ matrix.npm }} ci
      - name: Install latest stable SDKs without changing the lockfile
        if: matrix.sdk == 'latest'
        run: ${{ matrix.npm }} install --no-save --package-lock=false @oh-my-pi/pi-ai@latest @oh-my-pi/pi-coding-agent@latest
      - name: Report installed SDK versions
        run: node --input-type=module -e "import {readFileSync} from 'node:fs'; for (const name of ['@oh-my-pi/pi-ai', '@oh-my-pi/pi-coding-agent']) console.log(name, JSON.parse(readFileSync('node_modules/' + name + '/package.json', 'utf8')).version);"
      - run: ${{ matrix.npm }} test
      - run: ${{ matrix.npm }} run typecheck
      - run: ${{ matrix.npm }} run test:integration
      - name: Pack and check publishable contents
        id: pack
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          mkdir -p dist
          ${{ matrix.npm }} pack --ignore-scripts --json --pack-destination dist > dist/pack.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const pack = JSON.parse(readFileSync('dist/pack.json', 'utf8'))['@actu4l-human/omp-omniroute'];
          assert.equal(pack.name, '@actu4l-human/omp-omniroute');
          assert.match(pack.version, /^\d+\.\d+\.\d+$/);
          if (process.env.RELEASE_TAG) assert.equal(process.env.RELEASE_TAG, `v${pack.version}`);
          const allowed = new Set(['package.json', 'index.ts', 'README.md', 'CHANGELOG.md', 'LICENSE', '.env.example', 'overrides.example.json']);
          const paths = new Set(pack.files.map(file => file.path));
          for (const file of paths) assert.ok(allowed.has(file) || /^(src\/[^/]+\.ts|docs\/[^/]+\.md)$/.test(file), `Unexpected package file: ${file}`);
          for (const file of [...allowed, 'src/extension.ts']) assert.ok(paths.has(file), `Missing package file: ${file}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${pack.filename}\n`);
          NODE
      - name: Exercise the packed extension with the real OMP CLI
        run: ${{ matrix.npm }} run test:cli -- "dist/${{ steps.pack.outputs.filename }}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: matrix.canonical
        with:
          name: npm-package
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
